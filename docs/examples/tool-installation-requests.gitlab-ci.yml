# Opens an issue or a merge request in this project for each new tool
# installation request on a Galaxy server, then tells the requester where it is
# handled. Needs tool-installation-requests.sh from the ephemeris docs next to
# .gitlab-ci.yml, and a pipeline schedule. See the
# consume-tool-installation-requests page of the ephemeris docs.
tool-installation-requests:
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  resource_group: tool-installation-requests
  timeout: 30 minutes
  variables:
    EPHEMERIS_GALAXY: https://galaxy.example.org
    # Leave TOOLS_FILE out to open only issues, or set APPLY_COMMAND for other repository layouts.
    TOOLS_FILE: requested_tools.yaml
    # EPHEMERIS_API_KEY and FORGE_TOKEN come from masked CI/CD variables.
  script:
    - apt-get update -qq && apt-get install -qq -y jq > /dev/null
    - pip install ephemeris
    - git config user.name "Tool installation requests"
    - git config user.email "noreply@$CI_SERVER_HOST"
    - bash tool-installation-requests.sh
