# Opens an issue or a merge request in this project for each new tool
# installation request on a Galaxy server, tells the requester where it is
# handled, and later whether the tools got installed. Needs
# tool-installation-requests.sh from the ephemeris docs next to .gitlab-ci.yml,
# and a pipeline schedule. See the consume-tool-installation-requests page of
# the ephemeris docs.
variables:
  EPHEMERIS_GALAXY: https://galaxy.example.org
  # Leave TOOLS_FILE out to open only issues, or set APPLY_COMMAND for other repository layouts.
  TOOLS_FILE: requested_tools.yaml
  # EPHEMERIS_API_KEY and FORGE_TOKEN come from masked CI/CD variables.

tool-installation-requests:
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  resource_group: tool-installation-requests
  timeout: 30 minutes
  script:
    - apt-get update -qq && apt-get install -qq -y jq > /dev/null
    - pip install ephemeris
    - git config user.name "Tool installation requests"
    - git config user.email "noreply@$CI_SERVER_HOST"
    - bash tool-installation-requests.sh

# Installs the tool list into Galaxy whenever it changes on the default branch,
# for example when a request's merge request is merged. Leave it out if
# something else installs your tools.
install-tools:
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [requested_tools.yaml]
  resource_group: install-tools
  timeout: 2 hours
  script:
    - pip install ephemeris
    - shed-tools install --tools-file "$TOOLS_FILE"
