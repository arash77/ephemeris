# Opens an issue or a pull request in this repository for each new tool
# installation request on a Galaxy server, tells the requester where it is
# handled, and later whether the tools got installed. See the
# consume-tool-installation-requests page of the ephemeris docs.
name: Tool installation requests

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: tool-installation-requests

jobs:
  requests:
    name: Handle tool installation requests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push a branch for each pull request
      issues: write # open issues
      pull-requests: write # open pull requests
    env:
      EPHEMERIS_GALAXY: https://galaxy.example.org
      # Leave TOOLS_FILE out to open only issues, or set APPLY_COMMAND for other repository layouts.
      TOOLS_FILE: requested_tools.yaml
      # Without a bot that updates your tools, --pin-latest makes requests without a version pull requests too.
      EMIT_OPTIONS: --pin-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ephemeris
      - name: Open issues and pull requests
        env:
          EPHEMERIS_API_KEY: ${{ secrets.GALAXY_ADMIN_API_KEY }}
          FORGE_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          consume-tool-installation-requests run
